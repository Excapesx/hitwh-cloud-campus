<!doctype html>
<!--
  项目名：哈工威·云上校园
  运行方式：保存为 UTF-8 编码的 .html 文件，联网后用 Chrome 或 Edge 双击打开。
  操作：第一人称 WASD 移动，鼠标环顾，E 查看建筑，Esc 释放鼠标。
        俯瞰时拖拽旋转，滚轮或界面按钮缩放。手机可触摸拖拽俯瞰。
  校园模型为相对位置还原，非测绘精度。以南门—主楼为基准，其余点位、
  道路与地形按题述方位近似。建筑外形、门头及室外地貌均为程序化示意。
  校区楼名参考：威海市教育局考试公告
  https://jyj.weihai.gov.cn/art/2021/12/20/art_63036_2762153.html
  主楼形制与高度参考：哈工大《图话百年》校园主楼报道
  https://www.sohu.com/a/401134859_120492671
  两处餐厅名称参考：半岛网校园餐饮报道
  https://news.bandao.cn/news_html/201711/20171114/news_20171114_2780549.shtml
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#153c35">
<title>哈工威·云上校园</title>
<style>
  :root {
    color-scheme: light;
    --ink:#15372f; --muted:#4e675e; --accent:#175747; --deep:#133b32;
    --paper:#fbfcf3; --panel:rgba(251,252,243,.95); --line:#dce5d9;
    --shadow:0 12px 40px #152f3326; --gutter:clamp(12px, 2.2vw, 32px);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
  }
  *,*::before,*::after { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#c9dedf; color:var(--ink); }
  [hidden] { display:none!important; }
  button { font:inherit; cursor:pointer; color:inherit; }
  button:disabled { cursor:default; opacity:.55; }
  button:focus-visible { outline:3px solid #d9a64d; outline-offset:3px; }
  #world,#world canvas,#labels { position:absolute; inset:0; width:100%; height:100%; }
  #world canvas { display:block; touch-action:none; cursor:grab; }
  #world canvas.dragging { cursor:grabbing; }
  #labels { pointer-events:none; overflow:hidden; }
  .place {
    --label:#245c4e; position:absolute; top:0; left:0; white-space:nowrap;
    display:flex; align-items:center; gap:6px; padding:4px 8px 4px 5px; border-radius:5px;
    background:#fcfcf2ed; box-shadow:0 2px 10px #203b352b; color:#244138;
    font-size:11px; line-height:1.35; font-weight:700;
  }
  .place i { font-style:normal; background:var(--label); color:white; border-radius:3px; padding:1px 4px; font-size:9px; min-width:13px; text-align:center; }
  .place[data-kind="life"] { --label:#92523a; }
  .place[data-kind="sport"] { --label:#365d73; }
  .place[data-kind="gate"] { --label:#686044; }
  header {
    position:absolute; z-index:2; left:var(--gutter); top:max(var(--gutter),env(safe-area-inset-top));
    display:flex; align-items:center; gap:12px; padding:10px 15px 10px 10px;
    border:1px solid #fff9; border-radius:9px; background:var(--panel); box-shadow:var(--shadow);
    pointer-events:none;
  }
  .mark { width:35px; height:35px; display:grid; place-content:center; background:var(--deep); color:#fff9e3; border-radius:5px; font:700 12px Georgia,serif; letter-spacing:.08em; }
  .brand { display:grid; gap:3px; }
  .brand strong { font-size:15px; letter-spacing:.035em; }
  .brand small { color:var(--muted); font:700 9px system-ui,sans-serif; letter-spacing:.17em; }
  .map {
    position:absolute; z-index:2; top:max(var(--gutter),env(safe-area-inset-top)); right:var(--gutter);
    width:168px; padding:9px; background:var(--panel); box-shadow:var(--shadow);
    border:1px solid #fff9; border-radius:9px; pointer-events:none;
  }
  .map-title { display:flex; align-items:center; justify-content:space-between; padding:0 1px 7px; font-size:11px; font-weight:750; }
  .map-title b { color:var(--muted); font:700 10px system-ui; letter-spacing:.08em; }
  #map { width:100%; height:auto; display:block; border-radius:4px; }
  .hud {
    position:absolute; z-index:3; left:50%; bottom:max(22px,env(safe-area-inset-bottom)); transform:translateX(-50%);
    display:flex; align-items:center; gap:10px; width:max-content; max-width:calc(100% - 2 * var(--gutter));
    padding:7px; border:1px solid #fff8; border-radius:9px; background:var(--panel); box-shadow:var(--shadow);
  }
  .modes,.zoom { display:flex; gap:3px; flex:none; }
  .modes button,.zoom button { min-height:34px; padding:5px 10px; border:0; border-radius:5px; background:transparent; font-size:12px; font-weight:750; }
  .modes button:hover:not(:disabled),.zoom button:hover { background:#e1ede0; }
  .modes button[aria-pressed="true"] { background:var(--deep); color:#fffbed; }
  .zoom { border-left:1px solid var(--line); padding-left:6px; }
  .zoom button { min-width:32px; padding:2px; font-size:18px; line-height:1; }
  #hint { color:var(--muted); padding:0 5px 0 0; font-size:11px; white-space:nowrap; }
  .crosshair { position:absolute; z-index:2; top:50%; left:50%; width:20px; height:20px; transform:translate(-50%,-50%); color:#fff; pointer-events:none; }
  .crosshair::before,.crosshair::after { content:""; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:currentColor; border-radius:2px; box-shadow:0 0 3px #132b22; }
  .crosshair::before { width:17px; height:2px; }
  .crosshair::after { width:2px; height:17px; }
  .crosshair.hit { color:#62ff96; }
  #aim { position:absolute; z-index:2; left:50%; top:calc(50% + 21px); transform:translateX(-50%); border-radius:4px; padding:5px 8px; color:#fff; background:#15372eea; font-size:11px; white-space:nowrap; pointer-events:none; }
  .card {
    position:absolute; z-index:2; left:var(--gutter); bottom:82px; width:min(320px,calc(100vw - 2 * var(--gutter)));
    padding:17px 19px; border-left:4px solid #387c5f; border-radius:7px;
    background:var(--panel); box-shadow:var(--shadow); pointer-events:none;
  }
  .card h2 { margin:0 0 6px; font-size:20px; }
  .card p { margin:0; font-size:13px; line-height:1.6; color:var(--muted); }
  .veil {
    position:absolute; z-index:5; inset:0; display:flex; align-items:center; padding:var(--gutter);
    padding-top:max(var(--gutter),env(safe-area-inset-top)); overflow:auto;
    background:linear-gradient(90deg,#233e464d 0%,#1d3b421e 53%,transparent 100%);
  }
  .intro {
    width:min(414px,100%); margin:auto auto auto clamp(0px,4vw,74px); padding:clamp(23px,4vw,38px);
    background:var(--panel); border:1px solid #fff; border-radius:13px; box-shadow:0 22px 70px #20353540;
  }
  .eyebrow { display:flex; align-items:center; gap:9px; color:#345c4d; font-size:11px; font-weight:750; letter-spacing:.14em; }
  .eyebrow::before { content:""; width:20px; height:2px; background:#438263; }
  .intro h1 { font-size:clamp(24px,5.7vw,39px); margin:11px 0 10px; line-height:1.16; letter-spacing:-.06em; }
  .intro p { margin:0; color:var(--muted); font-size:13px; line-height:1.65; }
  .intro dl { margin:19px 0 21px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:9px 0; display:grid; grid-template-columns:max-content 1fr; gap:8px 12px; font-size:11px; line-height:1.4; }
  .intro dt { font-weight:800; }
  .intro dd { margin:0; color:var(--muted); }
  .start-actions { display:grid; gap:8px; }
  .start-actions button { border:1px solid #afc6b7; padding:10px 12px; border-radius:6px; background:transparent; font-weight:750; font-size:13px; }
  .start-actions button:first-child { background:var(--deep); border-color:var(--deep); color:#fffbed; }
  .start-actions button:hover:not(:disabled) { filter:brightness(1.16); }
  #boot { margin-top:9px; font-size:11px; color:#7f492d; }
  @media (max-width:700px) {
    .map { width:102px; padding:6px; }
    .map-title { padding-bottom:4px; font-size:9px; }
    #hint { display:none; }
    .veil { background:linear-gradient(0deg,#233e4660,transparent 75%); }
    .intro { margin:auto auto max(18px,env(safe-area-inset-bottom)); padding:19px; }
    .intro h1 { margin:8px 0; }
    .intro dl { margin:12px 0; }
    .place { font-size:9px; gap:4px; padding:3px 5px 3px 3px; }
    .place i { font-size:8px; }
  }
  @media (max-height:460px) {
    .intro { margin:auto auto auto 0; padding:14px; }
    .intro h1 { margin:5px 0; }
    .intro dl { margin:8px 0; }
    .start-actions { grid-template-columns:1fr 1fr; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="world" aria-label="哈工大威海三维校园"></div>
  <div id="labels" aria-hidden="true" hidden></div>
  <header hidden id="brand"><span class="mark" aria-hidden="true">HIT</span><div class="brand"><strong>哈工威·云上校园</strong><small>HIT WEIHAI</small></div></header>
  <aside class="map" id="mapPanel" hidden aria-label="小地图，正北朝上"><div class="map-title"><span>校园导览</span><b>↑ N</b></div><canvas id="map" width="320" height="276" aria-hidden="true"></canvas></aside>
  <div id="crosshair" class="crosshair" aria-hidden="true" hidden></div>
  <div id="aim" aria-hidden="true" hidden></div>
  <article class="card" id="card" aria-live="polite" hidden><h2 id="cardTitle"></h2><p id="cardDescription"></p></article>
  <nav id="hud" class="hud" aria-label="校园漫游控制" hidden>
    <div class="modes"><button id="walk" type="button" aria-pressed="false">第一人称</button><button id="orbit" type="button" aria-pressed="true">俯瞰全校</button></div>
    <div class="zoom" id="zoom"><button id="farther" type="button" aria-label="缩小">−</button><button id="nearer" type="button" aria-label="放大">+</button></div>
    <span id="hint" aria-live="polite">拖拽旋转 · 滚轮缩放</span>
  </nav>
  <div class="veil" id="start">
    <main class="intro" aria-labelledby="title">
      <div class="eyebrow">哈尔滨工业大学（威海）</div>
      <h1 id="title">哈工威·云上校园</h1>
      <p>从南门沿中轴走向主楼，或俯瞰教学楼、山上公寓与东侧运动区。</p>
      <dl><dt>第一人称</dt><dd>WASD 移动 · 鼠标环顾 · E 查看建筑 · Esc 释放鼠标</dd><dt>俯瞰全校</dt><dd>拖拽旋转 · 滚轮或按钮缩放 · 松手后缓慢旋转</dd></dl>
      <div class="start-actions"><button id="startWalk" type="button" disabled>进入第一人称漫游</button><button id="startOrbit" type="button" disabled>俯瞰全校</button></div>
      <p id="boot" role="status">正在加载三维校园…</p>
    </main>
  </div>

<script type="module">
const el = id => document.getElementById(id);
try {
  const [THREE, { PointerLockControls }] = await Promise.all([
    import('three'), import('three/addons/controls/PointerLockControls.js')
  ]);
  init(THREE, PointerLockControls);
} catch (error) {
  console.error(error);
  el('boot').textContent = '三维校园加载失败。请确认浏览器已启用 WebGL、能连接 Three.js CDN，然后刷新页面。';
}

function init(T, PointerLockControls) {
  // ── 场景 ── 1 场景单位 = 1 米。+X 向东、-Z 向北。
  const bounds = { minX:-223, maxX:223, minZ:-199, maxZ:196 };
  const scene = new T.Scene();
  scene.background = new T.Color(0xc8dfe4);
  scene.fog = new T.Fog(0xc8dfe4, 285, 1100);
  const walkCam = new T.PerspectiveCamera(67, 1, .12, 1250);
  const orbitCam = new T.PerspectiveCamera(42, 1, 14, 3250);
  const renderer = new T.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.outputColorSpace = T.SRGBColorSpace;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.20;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  // 光源与场景静止，只需生成一次阴影贴图。
  renderer.shadowMap.autoUpdate = false;
  renderer.shadowMap.needsUpdate = true;
  const canvas = renderer.domElement;
  el('world').append(canvas);
  const sun = new T.DirectionalLight(0xfff2d5, 2.35);
  sun.position.set(-210, 300, 120);
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = sun.shadow.camera.bottom = -345;
  sun.shadow.camera.right = sun.shadow.camera.top = 345;
  sun.shadow.camera.near = 10;
  sun.shadow.camera.far = 850;
  sun.shadow.camera.updateProjectionMatrix();
  sun.shadow.normalBias = .29;
  sun.shadow.bias = -.00014;
  sun.castShadow = true;
  scene.add(sun, new T.HemisphereLight(0xe9f7ff, 0x999778, 2.05));

  // ── 材质 ── 用共享几何与材质建模，窗格按材质批量实例化。
  const mat = (color, options) => new T.MeshStandardMaterial({ color, roughness:.87, ...options });
  const m = {
    terrain:mat(0xffffff,{ vertexColors:true }), asphalt:mat(0x505c5a), curb:mat(0xa8b3a0),
    path:mat(0xe4dac2), stone:mat(0xece0c8), line:mat(0xe9ead6), grass:mat(0x799b61),
    deepGrass:mat(0x638752), water:mat(0x65a7b3,{ roughness:.53 }), wall:mat(0xe5cda8),
    light:mat(0xf2e3c4), dorm:mat(0xdcc3a8), clay:mat(0xbe896f), dark:mat(0x394b53),
    roof:mat(0x3c5054), trim:mat(0xa9b7b0), blue:mat(0x78959b),
    windows:mat(0x416873,{ roughness:.41, metalness:.12 }),
    glass:mat(0x79b9c4,{ transparent:true, opacity:.54, roughness:.23, metalness:.12, depthWrite:false }),
    track:mat(0xa65d49), brass:mat(0xe3ca8f,{ metalness:.2 }), bark:mat(0x745e48),
    needles:mat(0xffffff,{ roughness:1 })
  };
  const boxGeometry = new T.BoxGeometry(1,1,1);
  const cylinderGeometry = new T.CylinderGeometry(1,1,1,48);
  const colliders = [];
  const landmarks = [];
  const rayMeshes = [];
  const windowPieces = [];
  const roads = [];
  function mesh(geometry, material, x, y, z, cast = true) {
    const obj = new T.Mesh(geometry, material);
    obj.position.set(x,y,z);
    obj.castShadow = cast;
    obj.receiveShadow = true;
    scene.add(obj);
    return obj;
  }
  function box(x,y,z,w,h,d,material,cast = true) {
    const obj = mesh(boxGeometry,material,x,y+h/2,z,cast);
    obj.scale.set(w,h,d);
    return obj;
  }
  function disc(x,y,z,r,h,material,cast = false) {
    const obj = mesh(cylinderGeometry,material,x,y+h/2,z,cast);
    obj.scale.set(r,h,r);
    return obj;
  }

  // ── 地面 ── 使用同一高度函数绘制地形、路面与行人脚底。
  // 西北台地抬升 12 米；坡面使用分段线性插值，楼址位于平坦段。
  const clamp = T.MathUtils.clamp;
  function height(x,z) {
    return 12 * Math.min(clamp((-x-90)/30,0,1),clamp((-z+58)/56,0,1));
  }
  const terrain = new T.PlaneGeometry(596,510,149,102);
  terrain.rotateX(-Math.PI/2);
  const terrainPos = terrain.attributes.position;
  const terrainColors = new Float32Array(terrainPos.count*3);
  const green = new T.Color();
  for (let i=0; i<terrainPos.count; i++) {
    const x=terrainPos.getX(i), z=terrainPos.getZ(i);
    const y=height(x,z);
    terrainPos.setY(i,y);
    const variation = .018*Math.sin(x*.052)*Math.cos(z*.063) + .012*Math.sin((x-z)*.13);
    green.setHex(y>6 ? 0x769563 : 0x8daa70).offsetHSL(0,0,variation);
    green.toArray(terrainColors,i*3);
  }
  terrain.setAttribute('color',new T.BufferAttribute(terrainColors,3));
  terrain.computeVertexNormals();
  mesh(terrain,m.terrain,0,0,0,false);
  // 封住地表边缘，使高地从北侧俯视时仍与底座相接。
  const edge=[];
  function skirt(ax,az,bx,bz) {
    const a=[ax,height(ax,az),az], b=[bx,height(bx,bz),bz];
    const lowA=[ax,-4,az], lowB=[bx,-4,bz];
    for(const v of [a,b,lowA,b,lowB,lowA]) edge.push(...v);
  }
  for(let x=-298; x<298; x+=4) {
    skirt(x,-255,x+4,-255);
    skirt(x+4,255,x,255);
  }
  for(let z=-255; z<255; z+=5) {
    skirt(298,z,298,z+5);
    skirt(-298,z+5,-298,z);
  }
  const skirtGeometry=new T.BufferGeometry();
  skirtGeometry.setAttribute('position',new T.Float32BufferAttribute(edge,3));
  skirtGeometry.computeVertexNormals();
  mesh(skirtGeometry,m.deepGrass,0,0,0,false);
  box(0,-4.4,-1140,3600,1,1805,m.water,false);

  // 水平铺装依地形切小网格，略抬高以避免与地表深度冲突。
  function paving(x,z,w,d,material,lift=.09) {
    const geo = new T.PlaneGeometry(w,d,Math.ceil(w/3),Math.ceil(d/3));
    geo.rotateX(-Math.PI/2);
    const p = geo.attributes.position;
    for (let i=0; i<p.count; i++) p.setY(i,height(x+p.getX(i),z+p.getZ(i))+lift);
    geo.computeVertexNormals();
    return mesh(geo,material,x,0,z,false);
  }
  function road(x,z,w,d) {
    roads.push({x,z,w,d});
    paving(x,z,w+2,d+2,m.curb,.16);
    paving(x,z,w,d,m.asphalt,.24);
  }
  road(0,188,458,13); road(0,69,448,10); road(0,-113,447,11);
  road(-89,31,10,314); road(90,31,10,314);
  road(-213,-31,9,172); road(212,-31,9,172); road(9,-162,11,94);
  paving(0,96,18,176,m.path,.31);
  paving(0,-10,31,31,m.path,.29);
  paving(-55,-36,79,6,m.path,.29); paving(55,-36,79,6,m.path,.29);
  paving(-161,-88,90,5,m.path,.31); paving(-164,-71,6,35,m.path,.32);
  paving(-154,120,112,6,m.path,.29); paving(145,104,109,6,m.path,.29);
  disc(0,.12,-18,32,.24,m.stone);
  disc(0,.37,-18,9.1,.13,m.trim);
  disc(0,.5,-18,7.8,.11,m.water);
  disc(0,.61,-18,1.8,.7,m.stone,true);
  // 喷泉外围可走，池心和池沿作为低矮障碍。
  addCollider(0,.12,-18,11,.55,11);
  for (const x of [-6,-3,0,3,6]) {
    paving(x,69,.72,8,m.line,.32);
    paving(x,188,.72,8,m.line,.32);
  }

  // ── 建筑 ── 建筑资料、轮廓拾取网格和碰撞体分别登记。
  function addCollider(x,y,z,w,h,d) {
    colliders.push({ minX:x-w/2,maxX:x+w/2,minY:y,maxY:y+h,minZ:z-d/2,maxZ:z+d/2 });
  }
  function landmark(name,code,description,x,z,kind='study',priority=2) {
    const entry={name,code,description,x,z,kind,priority,top:height(x,z),faces:[]};
    landmarks.push(entry);
    return entry;
  }
  function registerMesh(obj,entry) {
    obj.userData.landmark=entry;
    rayMeshes.push(obj);
    return obj;
  }
  function piece(entry,x,y,z,w,h,d,material,{solid=true,footprint=solid,cast=true}={}) {
    const obj=registerMesh(box(x,y,z,w,h,d,material,cast),entry);
    entry.top=Math.max(entry.top,y+h);
    if (solid) addCollider(x,y,z,w,h,d);
    if (footprint) entry.faces.push({x,z,w,d});
    return obj;
  }
  function hip(entry,x,y,z,w,d,h) {
    const geo = new T.CylinderGeometry(.74,1,1,4,1);
    geo.rotateY(Math.PI/4);
    const unitRadius=1/Math.SQRT2;
    geo.scale(unitRadius,1,unitRadius);
    const obj=registerMesh(mesh(geo,m.roof,x,y+h/2,z),entry);
    obj.scale.set(w,h,d);
    entry.top=Math.max(entry.top,y+h);
  }
  function windows(x,y,z,w,d,h,floors,columns) {
    const band=h/floors;
    for (let row=0; row<floors; row++) {
      const wy=y+(row+.52)*band, wh=Math.min(2.35,band*.54);
      for (let column=0; column<columns; column++) {
        const wx=x+((column+.5)/columns-.5)*(w-2.8);
        const ww=Math.min(2.8,(w-2.8)/columns*.56);
        windowPieces.push([wx,wy,z+d/2,ww,wh,.15],[wx,wy,z-d/2,ww,wh,.15]);
      }
      const sideCount=Math.max(2,Math.round(d/5));
      for (let column=0; column<sideCount; column++) {

    el('aim').hidden=!aimed;
    if(aimed) el('aim').textContent='E · '+aimed.name;
  }
  window.addEventListener('keydown',event=>{
    if(!locked()) return;
    if(movementKeys.has(event.code)) {
      event.preventDefault();
      held.add(event.code);
    } else if(event.code==='KeyE' && !event.repeat) {
      const entry=target();
      if(!entry) {
        el('card').hidden=true;
        return;
      }
      const card=el('card');
      const sameOpen=!card.hidden && card.dataset.building===entry.name;
      card.dataset.building=entry.name;
      el('cardTitle').textContent=entry.name;
      el('cardDescription').textContent=entry.description;
      card.hidden=sameOpen;
    }
  });
  window.addEventListener('keyup',event=>held.delete(event.code));

  // 俯瞰索引标注：优先显示地标，避免标牌互相覆盖。
  const labelRoot=el('labels');
  const labelItems=[...landmarks].sort((a,b)=>a.priority-b.priority).map(entry=>{
    const label=document.createElement('span');
    label.className='place';
    label.dataset.kind=entry.kind;
    const code=document.createElement('i');
    code.textContent=entry.code;
    label.append(code,document.createTextNode(entry.name));
    labelRoot.append(label);
    return {entry,label};
  });
  const projected=new T.Vector3();
  const reserved=[];
  function updateLabels() {
    if(!started || mode!=='orbit') return;
    const width=innerWidth, screenHeight=innerHeight;
    const compact=width<700;
    reserved.length=0;
    reserved.push([0,0,compact?181:225,compact?66:91],
                  [width-(compact?115:210),0,width,compact?119:201],
                  [width*.5-185,screenHeight-73,width*.5+185,screenHeight]);
    for(const {entry,label} of labelItems) {
      projected.set(entry.x,entry.top+3.3,entry.z).project(orbitCam);
      const x=(projected.x+1)*width*.5;
      const y=(1-projected.y)*screenHeight*.5;
      const w=(compact?9:11)*entry.name.length+(compact?19:27);
      const canShow=(!compact || entry.priority<=1) && projected.z>-1 && projected.z<1 &&
        x-w/2>5 && x+w/2<width-5 && y>16 && y<screenHeight-12;
      const rect=[x-w/2-4,y-23,x+w/2+4,y+3];
      const show=canShow && !reserved.some(([l,t,r,b])=>rect[0]<r && rect[2]>l && rect[1]<b && rect[3]>t);
      label.hidden=!show;
      if (show) {
        reserved.push(rect);
        label.style.transform='translate('+Math.round(x)+'px,'+Math.round(y)+'px) translate(-50%,-100%)';
      }
    }
  }

  // 小地图的道路、轮廓和树位源自同一组场景坐标。底图只绘制一次。
  const map=el('map');
  const mapContext=map.getContext('2d');
  const mapBase=document.createElement('canvas');
  mapBase.width=map.width;
  mapBase.height=map.height;
  const base=mapBase.getContext('2d');
  const mapScale=.622;
  const mx=x=>map.width/2+mapScale*x;
  const mz=z=>map.height/2+mapScale*z;
  function mapRect(ctx,x,z,w,d) { ctx.fillRect(mx(x-w/2),mz(z-d/2),w*mapScale,d*mapScale); }
  base.fillStyle='#d6e2c4';
  base.fillRect(0,0,map.width,map.height);
  base.fillStyle='#bfcca9';
  mapRect(base,-161,-117,151,158);
  base.fillStyle='#75817a';
  for(const r of roads) mapRect(base,r.x,r.z,r.w,r.d);
  base.fillStyle='#fbefcd';
  mapRect(base,0,91,17,182);
  base.beginPath();
  base.arc(mx(0),mz(-18),32*mapScale,0,Math.PI*2);
  base.fill();
  base.fillStyle='#77935e';
  for(const p of treeSites) base.fillRect(mx(p.x)-.75,mz(p.z)-.75,1.5,1.5);
  const mapColors={study:'#286556',life:'#aa7154',sport:'#497080',gate:'#786c48'};
  for(const entry of landmarks) {
    base.fillStyle=mapColors[entry.kind];
    for(const f of entry.faces) mapRect(base,f.x,f.z,f.w,f.d);
  }
  base.strokeStyle='#a65d49';
  base.lineWidth=3.6;
  base.beginPath();
  base.roundRect(mx(field.x-35),mz(field.z-47),70*mapScale,94*mapScale,23*mapScale);
  base.stroke();
  function updateMap() {
    if(!started) return;
    const ctx=mapContext;
    ctx.drawImage(mapBase,0,0);
    const walk=mode==='walk';
    const p=walk ? walkCam.position : orbitTarget;
    const x=mx(p.x), z=mz(p.z);
    ctx.save();
    ctx.translate(x,z);
    ctx.fillStyle=walk ? '#f5cd67' : '#174e42';
    ctx.strokeStyle='#ffffee';
    ctx.lineWidth=2;
    ctx.beginPath();
    if(walk) {
      walkCam.getWorldDirection(viewDirection);
      ctx.rotate(Math.atan2(viewDirection.x,-viewDirection.z));
      ctx.moveTo(0,-8); ctx.lineTo(5,5); ctx.lineTo(0,3); ctx.lineTo(-5,5);
      ctx.closePath();
    } else {
      ctx.arc(0,0,4.5,0,Math.PI*2);
    }
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // ── 主循环 ── 渲染跟随屏幕刷新率；物理累加到固定的 1/60 秒步长。
  function resize() {
    const w=Math.max(1,innerWidth), h=Math.max(1,innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,w<700?1.35:1.65));
    renderer.setSize(w,h);
    for(const camera of [walkCam,orbitCam]) {
      camera.aspect=w/h;
      camera.updateProjectionMatrix();
    }
  }
  window.addEventListener('resize',resize);
  resize();
  refreshMode();
  el('startOrbit').disabled=false;
  el('startWalk').disabled=el('walk').disabled=!pointerAvailable;
  el('boot').hidden=pointerAvailable;
  if(!pointerAvailable) el('boot').textContent='当前设备可使用触摸俯瞰。第一人称需要支持鼠标锁定的桌面浏览器。';

  // 防止首次射线拾取发生在第一帧渲染前，确保所有建筑世界矩阵已经生效。
  scene.updateMatrixWorld(true);
  let previous=performance.now(), lastMap=-Infinity;
  function frame(now) {
    const elapsed=clamp((now-previous)/1000,0,.1);
    previous=now;
    if(locked()) {
      accumulator+=elapsed;
      while(accumulator>=fixedStep) {
        walkStep(fixedStep);
        accumulator-=fixedStep;
      }
      updateTarget();
    } else {
      accumulator=0;
    }
    if(mode==='orbit') {
      if(dragId===null && now-dragEndedAt>850 && !reduceMotion.matches) azimuth+=elapsed*(started ? .075 : .042);
      radius=T.MathUtils.lerp(radius,targetRadius,1-Math.exp(-11*elapsed));
      const fit=fitDistance();
      const r=radius*fit, flat=r*Math.cos(elevation);
      scene.fog.near=490*fit;
      scene.fog.far=1560*fit;
      orbitCam.position.set(orbitTarget.x+Math.sin(azimuth)*flat,
                            orbitTarget.y+r*Math.sin(elevation),
                            orbitTarget.z+Math.cos(azimuth)*flat);
      orbitCam.lookAt(orbitTarget);
      orbitCam.updateMatrixWorld();
      updateLabels();
    }
    if(now-lastMap>64) {
      updateMap();
      lastMap=now;
    }
    renderer.render(scene,mode==='orbit'?orbitCam:walkCam);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
